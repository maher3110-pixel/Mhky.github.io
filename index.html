<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>View PDF</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    header { padding:12px 16px; background:#0b5cff; color:white; display:flex; align-items:center; gap:12px; }
    .download { margin-left:auto; background:rgba(255,255,255,0.12); padding:6px 10px; border-radius:6px; color:white; text-decoration:none; }
    .container { height: calc(100vh - 56px); }
    iframe, object { width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <header>
    <strong>My PDF</strong>
    <a class="download" href="./index.pdf" target="_blank" rel="noopener">Open / Download</a>
  </header>

  <div class="container">
    <iframe src="./index.pdf" title="PDF document"></iframe>
    <object data="./index.pdf" type="application/pdf" aria-label="PDF document">
      <p>Your browser does not support inline PDFs. You can <a href="./index.pdf" target="_blank" rel="noopener">download the PDF</a>.</p>
    </object>
  </div>
</body>
</html>
